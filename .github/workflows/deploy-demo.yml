# Builds the dashboard as a static site and publishes it to GitHub Pages.
#
# The demo has no Python process behind it, so the engine is run in demo mode
# during the build and its real API responses are captured as JSON fixtures.
# That keeps the deployed numbers honest: the detectors, sizing and risk scoring
# genuinely ran to produce them, rather than being hand-written to look good.

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the engine's test suite
        run: python -m pytest tests/ -q
        working-directory: backend

      - name: Capture demo fixtures from the real engine
        run: python -m scripts.generate_demo_fixtures
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build static demo
        run: npm run build:demo
        working-directory: frontend
        env:
          # Pages serves the site from /<repo>, so assets need that prefix.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Disable Jekyll
        # Without this, Pages strips the _next/ directory and the site loads
        # with no JavaScript or CSS at all.
        run: touch frontend/out/.nojekyll

      # Pages serves ONE site per repository and this action replaces all of it,
      # so a deploy from main used to take every branch preview down with it --
      # they are published under their own subdirectories and were simply not in
      # main's build output. The previews live in the `gh-pages` branch, which
      # acts as the accumulator; carry them across so main's deploy publishes the
      # whole site rather than its own share of it.
      - name: Preserve branch previews
        env:
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            echo "No gh-pages branch yet; nothing to preserve."
            exit 0
          fi

          work="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "$REMOTE" "$work" --quiet

          # Only directories, and never one main itself just produced: a preview
          # is a subdirectory, and anything colliding with main's own output is
          # main's to define.
          restored=0
          for dir in "$work"/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_next" ] && continue
            if [ -e "frontend/out/$name" ]; then continue; fi
            cp -a "$dir" "frontend/out/$name"
            echo "  preserved /$name/"
            restored=$((restored + 1))
          done
          echo "Carried across $restored branch preview(s)."

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repo if it is not already, so a fresh clone
          # deploys without anyone visiting the settings page first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
