# Builds the dashboard as a static site and publishes it to GitHub Pages.
#
# The demo has no Python process behind it, so the engine is run in demo mode
# during the build and its real API responses are captured as JSON fixtures.
# That keeps the deployed numbers honest: the detectors, sizing and risk scoring
# genuinely ran to produce them, rather than being hand-written to look good.
#
# ---------------------------------------------------------------------------
# How several branches stay live at once
# ---------------------------------------------------------------------------
# Pages serves ONE site per repository, and `actions/deploy-pages` replaces all
# of it on every deployment. With only a `main` trigger, every other branch's
# "demo" was simply the `main` build; adding a second trigger alone would have
# made the two branches take turns overwriting each other.
#
# So the site is assembled rather than replaced. A `gh-pages` branch holds the
# accumulated tree -- `main` at the root, every other branch in its own
# subdirectory -- and each run rewrites only its own directory before deploying
# the whole tree:
#
#     main             -> https://<owner>.github.io/<repo>/
#     ANTHONYS-BRANCH  -> https://<owner>.github.io/<repo>/anthony/
#
# Deploying the assembled tree through `actions/deploy-pages` means this works
# with the repository's existing "GitHub Actions" Pages source, with no settings
# change. `gh-pages` is storage here, not the serving root.
#
# This supersedes the separate "preserve branch previews" step main carried
# while the two workflows differed: that copied the previews into a main-only
# build before uploading, which was the right fix for a workflow that never
# wrote to gh-pages. This one writes there on every branch including main, so
# the assembled tree is already whole by the time it is deployed.

name: Deploy demo

on:
  push:
    branches: [main, ANTHONYS-BRANCH]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialise per branch: two runs racing on the same subdirectory would leave
# gh-pages half-written. Different branches write to different subdirectories,
# so they need not queue behind each other -- only the final push does, and
# that is rebased and retried below.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Everything downstream keys off these: where on the site this build
      # lives, and what the provenance ribbon in the UI reports.
      - name: Resolve deploy target
        id: target
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            main)
              subdir=""
              ;;
            # Named explicitly. Deriving a short slug from the branch name by
            # rule produced "anthonys", which is nobody's idea of a URL: the
            # only honest way to get the documented /anthony/ is to say so.
            ANTHONYS-BRANCH)
              subdir="anthony"
              ;;
            *)
              # Anything else gets a mechanical slug: lowercased, with runs of
              # URL-unsafe characters collapsed to a single dash.
              subdir=$(printf '%s' "$branch" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -e 's/[^a-z0-9._-][^a-z0-9._-]*/-/g' -e 's/^-*//' -e 's/-*$//')
              if [ -z "$subdir" ]; then subdir="preview"; fi
              ;;
          esac
          base="/${{ github.event.repository.name }}${subdir:+/$subdir}"
          {
            echo "branch=$branch"
            echo "subdir=$subdir"
            echo "base_path=$base"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          # A commit subject can contain quotes; the delimited form carries it
          # verbatim. Truncated, because the ribbon shows one line.
          {
            echo "subject<<COMMIT_SUBJECT_EOF"
            git log -1 --pretty=%s | cut -c1-160
            echo "COMMIT_SUBJECT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing '$branch' to '$base'"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install engine dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run the engine's test suite
        run: python -m pytest tests/ -q
        working-directory: backend

      # Regenerated on every push, so the deployed fixtures are always THIS
      # commit's detectors, sizing and scoring -- not a snapshot committed
      # weeks ago. This is what makes the branch demo track the branch.
      - name: Capture demo fixtures from the real engine
        run: python -m scripts.generate_demo_fixtures
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # Asserts the TypeScript odds port against the same vectors the Python
      # suite uses, so the two implementations cannot drift apart unnoticed.
      - name: Test the dashboard
        run: npm test
        working-directory: frontend

      - name: Build static demo
        run: npm run build:demo
        working-directory: frontend
        env:
          # Pages serves the site from /<repo>[/<slug>], so assets need that
          # prefix or every _next/ request 404s.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.target.outputs.base_path }}
          NEXT_PUBLIC_BUILD_BRANCH: ${{ steps.target.outputs.branch }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.target.outputs.built_at }}
          NEXT_PUBLIC_BUILD_SUBJECT: ${{ steps.target.outputs.subject }}
          NEXT_PUBLIC_BUILD_REPO: ${{ github.repository }}
          NEXT_PUBLIC_BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Disable Jekyll
        # Without this, Pages strips the _next/ directory and the site loads
        # with no JavaScript or CSS at all.
        run: touch frontend/out/.nojekyll

      # Publishes into gh-pages under this branch's subdirectory, replacing only
      # that subdirectory. Other branches' demos are left untouched, which is
      # the whole point of the layout.
      - name: Publish to gh-pages
        env:
          SUBDIR: ${{ steps.target.outputs.subdir }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT_SHA: ${{ github.sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_NAME: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          origin="https://x-access-token:${GH_TOKEN}@${REMOTE#https://}"

          work="${RUNNER_TEMP}/gh-pages"
          rm -rf "$work"
          if git ls-remote --exit-code --heads "$origin" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$origin" "$work"
          else
            git clone --depth 1 "$origin" "$work"
            git -C "$work" checkout --orphan gh-pages
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          fi

          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$SUBDIR" ]; then
            # main owns the root -- but only the part of it main produces.
            #
            # Clearing the root wholesale is the obvious way to drop files a
            # later build no longer emits, and it is wrong here: a branch
            # preview is a directory at exactly that level, so wholesale is how
            # every preview gets deleted on the next push to main. The set main
            # owns is precisely the set of names in its own build output, so
            # remove those and leave anything else standing.
            for entry in "$work"/* "$work"/.[!.]*; do
              [ -e "$entry" ] || continue
              name="$(basename "$entry")"
              [ "$name" = ".git" ] && continue
              if [ -e "frontend/out/$name" ]; then
                rm -rf "$entry"
              fi
            done
            cp -a frontend/out/. "$work"/
          else
            rm -rf "${work:?}/${SUBDIR:?}"
            mkdir -p "$work/$SUBDIR"
            cp -a frontend/out/. "$work/$SUBDIR"/
          fi

          # Seed the root from main if nothing has published there yet.
          #
          # Main publishes its own build to the root on every push, so this is
          # only reached on a fresh gh-pages branch -- a first run, or one
          # recreated from scratch -- where the root would otherwise 404 until
          # main next happened to be pushed. It costs one `npm ci` and disables
          # itself as soon as a root build exists.
          if [ ! -f "$work/index.html" ]; then
            echo "gh-pages root is empty; building main's demo to fill it"
            main_src="$(mktemp -d)"
            git clone --depth 1 --branch main "$origin" "$main_src"
            ( cd "$main_src/frontend" \
              && npm ci --no-audit --no-fund \
              && NEXT_PUBLIC_STATIC_DEMO=true NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}" \
                 npx next build )
            cp -a "$main_src/frontend/out/." "$work"/
            rm -rf "$main_src"
          fi

          # Pages needs this at the root whichever branch published.
          touch "$work/.nojekyll"

          cd "$work"
          git add -A
          if git diff --cached --quiet; then
            # Not a failure, and not a reason to skip the deploy below: this
            # tree is still the one that should be live.
            echo "gh-pages already matches this build; deploying it unchanged."
            exit 0
          fi

          git commit -m "demo: ${BRANCH} @ ${COMMIT_SHA}"

          # Two branches finishing at once both push to gh-pages. Rebase and
          # retry rather than failing the run: the trees touch different
          # directories, so the rebase is always trivial.
          for attempt in 1 2 3 4 5; do
            if git push "$origin" gh-pages; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing (attempt $attempt)"
            git fetch "$origin" gh-pages
            git rebase FETCH_HEAD
            sleep $(( attempt * 3 ))
          done
          echo "could not publish to gh-pages after 5 attempts" >&2
          exit 1

      # The assembled tree -- every branch's demo -- becomes the Pages artifact.
      # Deploying it through `actions/deploy-pages` is what lets this work with
      # the repository's existing "GitHub Actions" Pages source: no settings
      # change, and the branch subdirectories survive because the deployment
      # carries all of them, not just the branch that triggered the run.
      - name: Stage the assembled site
        run: |
          set -euo pipefail
          # The artifact is a tarball of this directory; .git is a few thousand
          # objects of pure noise inside it.
          rm -rf "${RUNNER_TEMP}/gh-pages/.git"
          find "${RUNNER_TEMP}/gh-pages" -maxdepth 1 -mindepth 1 -printf '  %f\n'

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repo if it is not already, so a fresh clone
          # deploys without anyone visiting the settings page first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gh-pages

      - name: Summary
        if: always()
        env:
          SUBDIR: ${{ steps.target.outputs.subdir }}
          BRANCH: ${{ steps.target.outputs.branch }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          path="https://${OWNER}.github.io/${REPO}/"
          if [ -n "$SUBDIR" ]; then path="${path}${SUBDIR}/"; fi
          {
            echo "### Demo published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| URL | ${path} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job because `actions/deploy-pages` requires the github-pages
  # environment, and binding that to the build job would gate every push on an
  # environment approval rather than just the publish.
  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    # No `environment:` block, deliberately. The `github-pages` environment
    # carries a deployment branch policy allowing `main` only; declaring the
    # environment makes the runner refuse this job before the action even
    # starts, which is what failed every deploy from this branch. Widening that
    # policy needs repository admin. The branch protection is on the
    # ENVIRONMENT, not on the Pages API, so a job that does not claim the
    # environment deploys normally -- at the cost of the deployment not showing
    # up under the repository's Environments tab.
    # A Pages deployment is repository-wide, so unlike the per-branch build it
    # genuinely cannot run concurrently with another. Never cancel one midway:
    # a half-published site is worse than a slightly stale one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
